<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>Trafik Testi</title>
  <style>
    body {
      background: #020617;
      margin: 0;
      height: 100vh;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .auth-card-mock {
      width: 480px;
      height: 520px;
      background: rgba(15, 23, 42, 0.45);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border: 1.5px solid rgba(56, 189, 248, 0.4);
      border-radius: 32px;
      box-shadow: 0 40px 90px rgba(0,0,0,0.9);
      position: relative;
      z-index: 10;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #fff;
      font-family: sans-serif;
      font-size: 20px;
    }
    .traffic-container {
      position: absolute;
      inset: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      overflow: hidden;
      z-index: 2;
    }
  </style>
</head>
<body>
  <div class="traffic-container">
    <!-- Test lanes -->
  </div>
  <div class="auth-card-mock">
    LOGIN CARD (Ön Planda)
  </div>
</body>
</html>
